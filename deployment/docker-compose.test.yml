services:
  mongodb-test:
    image: mongo:9.0
    environment:
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    # Single-node replica set with a key file generated at each start: same set-up as the
    # `mongodb` service of docker-compose.yml, explained there.
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    # root/example creds: loopback only, not reachable from the LAN (same as docker-compose.yml).
    # api-test and front-test below are loopback-bound too: weak smoke secrets + public seed creds.
    ports:
      - "127.0.0.1:27019:27017"
    # The healthcheck initiates the replica set, then passes once this node is primary. Until then
    # the port answers but a write or the `prisma db push` of `make stack-test-up` fails with
    # "node is not in primary or recovering state".
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "root",
          "-p",
          "example",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api-test:
    build:
      context: ..
      dockerfile: deployment/backend/Dockerfile
    ports:
      - "127.0.0.1:4001:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: mongodb://root:example@mongodb-test:27017/app?authSource=admin&directConnection=true
      JWT_SECRET: smoke-test-secret
      JWT_EXPIRE: "7200"
      CRYPT_SALT: "8"
      ACTIVATION_TOKEN_EXPIRY_HOURS: "48"
      MAX_LOGIN_ATTEMPTS: "1000"
      LOGIN_RATE_LIMIT: "1000"
      REGISTER_RATE_LIMIT: "1000"
      EMAIL_RATE_LIMIT: "1000"
      TOKEN_RATE_LIMIT: "1000"
      FRONTEND_URL: http://localhost:3001
    depends_on:
      mongodb-test:
        condition: service_healthy

  front-test:
    build:
      context: ..
      dockerfile: deployment/frontend/Dockerfile
      args:
        VITE_BACKEND_BASEURL: http://localhost:4001/
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - api-test
