services:
  mongodb-test:
    image: prismagraphql/mongo-single-replica:4.4.3-bionic
    environment:
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      INIT_WAIT_SEC: 10
    # root/example creds: loopback only, not reachable from the LAN (same as docker-compose.yml).
    # api-test and front-test below are loopback-bound too: weak smoke secrets + public seed creds.
    ports:
      - "127.0.0.1:27019:27017"
    # Healthy = replica set initiated and this node is primary. A plain ping already answers while
    # the image is still restarting mongod (INIT_WAIT_SEC), and the first write or `prisma db push`
    # from `make stack-test-up` then fails with "node is not in primary or recovering state".
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--quiet",
          "--eval",
          "quit(db.isMaster().setName && db.isMaster().ismaster ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api-test:
    build:
      context: ..
      dockerfile: deployment/backend/Dockerfile
    ports:
      - "127.0.0.1:4001:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: mongodb://root:example@mongodb-test:27017/app?authSource=admin&directConnection=true
      JWT_SECRET: smoke-test-secret
      JWT_EXPIRE: "7200"
      CRYPT_SALT: "8"
      ACTIVATION_TOKEN_EXPIRY_HOURS: "48"
      MAX_LOGIN_ATTEMPTS: "1000"
      LOGIN_RATE_LIMIT: "1000"
      REGISTER_RATE_LIMIT: "1000"
      EMAIL_RATE_LIMIT: "1000"
      TOKEN_RATE_LIMIT: "1000"
      FRONTEND_URL: http://localhost:3001
    depends_on:
      mongodb-test:
        condition: service_healthy

  front-test:
    build:
      context: ..
      dockerfile: deployment/frontend/Dockerfile
      args:
        VITE_BACKEND_BASEURL: http://localhost:4001/
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - api-test
