services:
  swagger-editor:
    image: swaggerapi/swagger-editor:v5.0.0-alpha.98-unprivileged
    container_name: "swagger-editor-container"
    ports:
      - "8081:8080"
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: "swagger-ui-container"
    ports:
      - "8082:8080"
    volumes:
      - ../backend/openapi.yml:/openapi.yml
    environment:
      SWAGGER_JSON: /openapi.yml
  # TODO(pre-prod): hardcoded root/example creds — fine on localhost only. Before deploying this
  # compose file to a remote server: use secrets/env-injected creds, or keep the loopback bind below.
  mongodb:
    image: mongo:9.0
    env_file: ../backend/.env
    environment:
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    # Single-node replica set: Prisma needs one for transactions. mongod refuses --replSet with
    # authentication unless it gets a key file. With one node nobody else reads that key, so it is
    # generated at each start instead of being stored.
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    ports:
      - "127.0.0.1:27017:27017"
    # Named volumes: the data outlives the container and is easy to find and back up.
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    # The healthcheck initiates the replica set when the data directory has none, then passes once
    # this node is primary. It reads the state from the data, so a recreated container that gets
    # its volumes back starts normally. Until the node is primary the port answers but a write
    # fails with "node is not in primary or recovering state". Same check as docker-compose.test.yml.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "root",
          "-p",
          "example",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  # TODO(pre-prod): no auth on this UI (ME_CONFIG_BASICAUTH: "false") — fine on localhost only.
  # Before deploying this compose file to a remote server: set ME_CONFIG_BASICAUTH: "true" +
  # ME_CONFIG_BASICAUTH_USERNAME/PASSWORD, or bind the port to "127.0.0.1:8083:8081".
  db-viewer:
    image: mongo-express
    restart: always
    env_file: ../backend/.env
    ports:
      - "8083:8081"
    environment:
      # backend/.env (env_file) carries the PORT of the API, and Mongo Express reads PORT too:
      # without this line it listens on that port instead of 8081, and the published port answers nothing.
      PORT: 8081
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/app?authSource=admin&directConnection=true
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deployment/backend/Dockerfile
    ports:
      - "4000:3000"
    env_file: ../backend/.env
    environment:
      DATABASE_URL: mongodb://root:example@mongodb:27017/app?authSource=admin&directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
  mongodb-config:
